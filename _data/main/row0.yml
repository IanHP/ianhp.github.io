    My name is Ian Herzog-Pohl -- I am a senior majoring in computational biology,
    minoring in history and physics at the University of Pittsburgh. My main focus
    is in computational structural biology, though I have an interest in all molecular
    biology, learning how macroscopic biology connects to base physical and chemical principles
    at the molecular level.
    
    However, I also enjoy programming personal projects, especially creating games and "add-ons"
    for Minecraft. Recently, as a way to get more involved in the local music scene and a chance
    to express a more creative side of myself, I have also gotten involved in music journalism with 
    Deja, a local arts magazine