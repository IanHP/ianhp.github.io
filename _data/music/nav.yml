title: Music Journalism
link: music.html
desc: |
  While biology and computer science are my main interests, by my junior year of college
  I felt pretty cooped up in all of this STEM. I had also been getting more and more 
  involved in the local Pittsburgh rock scene, going to a number of shows in my
  sophmore year. Then, when I heard that a local music magazine was being started, 
  based out of my favorite venue, I quickly contacted the editor-in-chief to see 
  if I could become a writer!

  From then, I have written three articles about three different local bands, focusing 
  on different aspects of creating a local band, with a special emphasis on the value 
  of community.
