    **Bomb Buddies** - Feburary 2021

    Bomb Buddies is a 1-2 person blow-up-a-thon with 2 gamemodes. 
    A classic mode where you try and blow up 13 (final one is unlocked after you 
    100% all others) different structures with a set amount of throwable TNT, and 
    a ranked mode where you try to blow up these structures as efficiently as possible 
    to get onto a local leaderboard.

    Trailer on Youtube for map [here](https://www.youtube.com/watch?v=qosWP319HgI)

    Find the map [here](https://www.planetminecraft.com/project/bomb-buddies/)  
    Official Minecraft blog post about map [here](https://www.minecraft.net/en-us/article/new-java-realms-don-t-lose-yourself?ref=launcher#:~:text=arrows%2C%20but%20still.-,BOMB%20BUDDIES,-by%C2%A0The%20People)