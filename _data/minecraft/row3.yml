    **Super Traitor Mystery** - December 2020

    Super Traitor Mystery is a take on the classic murder mystery games, 
    where everyone is a traitor, innocent, or detective. It is the job of the 
    traitors to kill all of the innocents, while the innocents must determine who 
    the traitors are and eliminate them before it is too late. 

    Find the map [here](https://www.planetminecraft.com/project/super-murder-mystery/)  
    Official Minecraft blog post about map [here](https://www.minecraft.net/en-us/article/new-java-realms-the-raven#:~:text=SUPER%20TRAITOR%20MYSTERY)