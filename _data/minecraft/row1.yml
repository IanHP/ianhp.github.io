    **Random Royale** - Feburary 2023

    Random Royale is Minecraft combat, but everything is random! From items, 
    to armor, to even the map. There are also many different gamemodes and settings 
    to allow you to customize the experience to your tastes.

    Find the map [here](https://www.planetminecraft.com/project/random-royale-randomized-combat-minigame/)  
    Official Minecraft blog post about map [here](https://www.minecraft.net/en-us/article/new-realms--november-2023#RANDOM%20ROYALE:~:text=from%20the%20beginning!-,RANDOM%20ROYALE,-by%20The%20People)
