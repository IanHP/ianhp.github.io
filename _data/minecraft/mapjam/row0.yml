  title: "Oceaneer"
  desc: | 
    Vertex Mapjam #2 - March 2020 

    My first mapjam, I created an ocean exploration map where you must dive into the
    depth to figure out how to escape the island.

    After the mapjam, my friends and I worked on the map to get it ready for a real release  
    Find the map [here](https://www.planetminecraft.com/project/oceaneer/)  
