  title: "Pig Ball"
  desc: | 
    Yeggs Mapjam #2 - August 2020 

    My second mapjam, I created a game where two teams of players must try to 
    hit a pig (which acts as a ball) into the opposing team's goal. 
- type: "small_photo"
