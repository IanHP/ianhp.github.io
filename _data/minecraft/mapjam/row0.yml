  title: "Shroomin'"
  desc: | 
    Vertex Spring Mapjam - March 2021 

    I created an puzzle game, where the player is found in a magical mushroom forest 
    and must solve puzzles in each zone using magical mushrooms to escape
- type: "small_photo"
  photo: "/assets/img/oceaneer.webp"
  title: "Build Flip"
  desc: | 
    Yeggs Holiday Jam - December 2021 

    Our last mapjam, players would be given a theme and have to build a structure in a limited
    time. Once time was up, the builds would swap and each player would have to continue off
    of another player's build.