
<!-- 
  @component Profile Subsection
  @description Puts image on left screen, puts text on right wrapping around
  @param {image path} image - image placed on right
  @param {HTML} content - text to right of image
  @param {int} width - how wide the photo is meant to be
  @param {bool} rev - if the profile should be in reverse order or not
-->
<div style="display: flex; gap: 20px; align-items: flex-start;">
  {% if include.cont.rev == false %}
  <img src="{{ include.cont.photo | relative_url }}" alt="description" width="{{ include.cont.width }}">
  <div>
    {{ include.cont.desc | markdownify}}
  </div>
  {% else %}
  <div>
    {{ include.cont.desc | markdownify}}
  </div>
  <img src="{{ include.cont.photo | relative_url }}" alt="description" width="{{ include.cont.width }}">
  {% endif %}
</div>
