{% if include.cont.credit %}
<figure class="img-credited">
    <img src= "{{ include.cont.photo }}" alt="Describe the photo here" class="adjust">
    <figcaption>Photo Credit: <a class="white" href={{include.cont.credit_link}}>{{include.cont.credit}}</a></figcaption>
</figure>
{% else %}
<img src= "{{ include.cont.photo }}" alt="Describe the photo here" class="img-base">
{% endif %}
