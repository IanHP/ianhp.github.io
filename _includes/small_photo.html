<html lang="en">
<body>
  <article class="small_img-main">

    <!-- 1. Photo -->
    <img src="{{ include.photo }}" alt="Describe the photo here" class="small_img-img">

    <!-- 2. Big descriptor title -->
    <h1 class="small_img-title"><a href="{{ include.link}}">{{ include.title }}</a></h1>

    <!-- 3. Text beneath -->
    <div class="small_img-description">
      <p>Your text goes here. This paragraph sits below the title and holds
         the main description. Replace it with whatever you want to say.</p>
      <p>Add as many paragraphs as you like — they'll stack neatly beneath
         the title, all within the same centered column.</p>
    </div>

  </article>
</body>
</html>
